name: 定时采集与自动入库

on:
  schedule:
    # 北京时间每周三、周日 08:00 采集、整理并直接更新默认分支。
    - cron: '0 0 * * 0,3'
  workflow_dispatch:
    inputs:
      mode:
        description: 执行内容
        type: choice
        options:
          - daily
          - discover
          - publish
        default: daily
      ai:
        description: AI 辅助（auto 配好即用，off 关闭，required 要求配置完整）
        type: choice
        options:
          - auto
          - 'off'
          - required
        default: required
      full:
        description: 忽略搜索检查点，补查全部范围（仍受分页上限限制）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hyperframes-discovery
  cancel-in-progress: false

jobs:
  discover:
    # fork 不自动写入；仍可由 fork 维护者在默认分支手动运行。
    if: github.ref_name == github.event.repository.default_branch && (github.repository == 'xiaoyingjiang-studio/awesome-hyperframes' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: 发布前检查
        run: python -m unittest discover -s tests -q
      - name: 采集、整理与直接入库
        env:
          GH_TOKEN: ${{ github.token }}
          DISCOVERY_MODE: ${{ inputs.mode || 'daily' }}
          FULL_SCAN: ${{ inputs.full || false }}
          AI_MODE: ${{ inputs.ai || 'required' }}
          AI_ENDPOINT: ${{ vars.AI_ENDPOINT }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_ENABLE_THINKING: ${{ vars.AI_ENABLE_THINKING || 'false' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MAX_CALLS: '3'
          AI_MAX_TOTAL_TOKENS: '60000'
          AI_MAX_OUTPUT_TOKENS: ${{ vars.AI_MAX_OUTPUT_TOKENS || '6000' }}
          AI_TIMEOUT_MS: '60000'
        shell: bash
        run: |
          args=(--mode "$DISCOVERY_MODE" --ai "$AI_MODE" --publish --repository "$GITHUB_REPOSITORY")
          if [ "$FULL_SCAN" = "true" ]; then args+=(--full); fi
          python scripts/discover.py "${args[@]}"
      - name: 发布运行摘要
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/discovery/run-summary.md ]; then
            cat artifacts/discovery/run-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
